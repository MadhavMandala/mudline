# The fast suite on every push: everything except CAD lofting and meshing,
# which are marked slow. The oracle's golden data is committed, so the
# term-by-term aerodynamics comparison runs here without RASAero installed.
#
# A Windows runner, deliberately: the project is developed on Windows and the
# GUI tests run PySide6 offscreen, which needs no system packages there.
#
# The full `cad` extra is installed, under constraints.txt, because the cheap
# install this job used to do was a different environment from the one anyone
# actually runs. Without pyvista and vtk there is no `six` on the path, so the
# matplotlib clash that breaks every plot export never fired here; and with
# whatever versions pip resolved on the day, a green run said nothing about
# the set the tool is validated on.

name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fast-suite:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[cad,dev]" -c constraints.txt

      # The clean-environment failures this project has actually shipped were
      # imports the suite structurally cannot see: moderngl is imported only
      # from a GL callback the offscreen platform never invokes, and
      # cadquery's OCP proxy can lose its VTK half depending on import order.
      # Checking them before pytest turns either into a one-line failure
      # instead of a dead viewport on someone else's machine.
      - name: Imports a developer machine hides
        run: python -m tools.check_environment

      - name: Test
        run: python -m pytest -m "not slow" -q
